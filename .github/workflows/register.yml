name: Twitch Registration

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of accounts to register"
        required: false
        default: "1"
  push:
    branches: [main]

jobs:
  register:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run registration
        env:
          COUNT: ${{ github.event.inputs.count || '1' }}
          TEMPMAIL_BASE_URL: https://mail.minecraft-cn.net
          TEMPMAIL_DOMAIN: olsbvgq.shop
          PROXY: ${{ secrets.PROXY }}
          HEADLESS: "0"
        run: |
          xvfb-run -a --server-args="-screen 0 1366x768x24" python main.py

      - name: Upload accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounts
          path: results/
          if-no-files-found: warn
          retention-days: 30
