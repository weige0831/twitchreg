name: Twitch Register

on:
  workflow_dispatch:
    inputs:
      cdk_api_url:
        description: "CDK管理系统地址 (例: http://1.2.3.4:5000)"
        required: true
        type: string
      mail_domain:
        description: "注册邮箱域名"
        required: true
        default: "olsbvgq.shop"
        type: string
      concurrency:
        description: "每个Job的并发线程数"
        required: true
        default: "1"
        type: string
      count_per_job:
        description: "每个Job注册数量 (0=无限)"
        required: true
        default: "10"
        type: string
      job_count:
        description: "启动的Job数量"
        required: true
        default: "1"
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          echo "matrix=$(python3 -c "import json; print(json.dumps({'id': list(range(1, ${{ inputs.job_count }} + 1))}))")" >> "$GITHUB_OUTPUT"

  register:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m camoufox fetch
          sudo apt-get install -y xvfb

      - name: Run registration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run --auto-servernum python main.py \
            --api-url "${{ inputs.cdk_api_url }}" \
            --mail-domain "${{ inputs.mail_domain }}" \
            -w ${{ inputs.concurrency }} \
            -n ${{ inputs.count_per_job }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ matrix.id }}
          path: debug_*.png
          if-no-files-found: ignore
